# Dán vào trong khối server { } của mta.thinhdhm.id.vn (cổng 443), rồi: sudo nginx -t && sudo systemctl reload nginx
location = /teacher-bot { return 301 /teacher-bot/; }

location /teacher-bot/ {
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE: không đệm, giữ kết nối lâu
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    # ảnh bài tập gửi dạng base64 trong JSON
    client_max_body_size 30m;
}
